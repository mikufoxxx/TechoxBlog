# 应用名称
spring.application.name=Blog

# 数据库连接配置
# MySQL数据库连接地址
spring.datasource.url=jdbc:mysql://152.53.165.99:3306/blog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
# MySQL用户名
spring.datasource.username=blog
# MySQL密码
spring.datasource.password=Specialfox233
# MySQL驱动类
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA相关配置
# 自动建表/更新表结构
spring.jpa.hibernate.ddl-auto=update
# 控制台显示SQL语句
spring.jpa.show-sql=true
# 指定MySQL方言
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# 格式化SQL输出
spring.jpa.properties.hibernate.format_sql=true

# Redis相关配置，当前未启用，如需使用可取消注释
# spring.data.redis.host=152.53.165.99 # Redis服务器地址
# spring.data.redis.port=6379 # Redis端口
# spring.data.redis.database=0 # Redis数据库编号

# 服务端口
# 项目启动端口
server.port=8080

# 日志级别配置
# 指定包的日志级别
logging.level.cc.techox.blog=DEBUG

